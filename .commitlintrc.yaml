extends:
  - "@commitlint/config-conventional"

rules:
  type-enum:
    - 2
    - always
    - - build
      - chore
      - ci
      - docs
      - feat
      - fix
      - perf
      - refactor
      - revert
      - reapply
      - style
      - test
  scope-enum:
    - 2
    - always
    - - bubbles
      - ci
      - cmd
      - deps
      - dev
      - diff
      - docs
      - examples
      - fangs
      - finder
      - internal
      - line
      - normalizer
      - paths
      - position
      - printer
      - schema
      - style
      - tasks
      - tokens
  header-max-length:
    - 2
    - always
    - 89
  body-max-line-length:
    - 2
    - always
    - 72
