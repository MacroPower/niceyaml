---
# Definitions that the other schemas and the documents share.
$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  price:
    description: A price in whole kr.
    type: integer
    minimum: 0
  time:
    description: A time of day on the 24-hour clock, such as 07:00.
    type: string
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
  hours:
    type: object
    required: [open, close]
    additionalProperties: false
    properties:
      open: { $ref: "#/$defs/time" }
      close: { $ref: "#/$defs/time" }
