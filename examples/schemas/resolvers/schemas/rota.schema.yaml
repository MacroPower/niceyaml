---
$schema: https://json-schema.org/draft/2020-12/schema
title: Rota
type: object
required: [kind, baristas]
additionalProperties: false
properties:
  kind: { const: Rota }
  baristas:
    type: object
    propertyNames:
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    additionalProperties:
      type: array
      minItems: 1
      items: { type: string }
