version: "3"

set: [errexit, nounset, pipefail]
shopt: [globstar]

# These tasks lint the GitHub configuration. Both checks run through Dagger via
# the `ci` toolchain because neither tool is on the devbox PATH. The zizmor
# toolchain lints the Actions workflows, and a pinned renovate-config-validator
# in a Node container checks the Renovate config.
tasks:
  actions:lint:
    desc: Lints GitHub Actions workflows with zizmor
    summary: |
      This task runs zizmor against .github/workflows with .github/zizmor.yaml,
      through the zizmor toolchain that the `ci` toolchain depends on. It runs
      through Dagger because zizmor is not on the devbox PATH.
    # `sources` skips the Dagger invocation when no workflow or zizmor config
    # changed. The fingerprint does not track the zizmor version, which the
    # `ci` module pins. Re-run with --force or `task clean` after upgrading the
    # toolchain.
    sources:
      - .github/workflows/*.yaml
      - .github/workflows/*.yml
      - .github/zizmor.yaml
    cmds:
      - dagger call ci lint-actions

  renovate:lint:
    desc: Validates the Renovate configuration with renovate-config-validator
    summary: |
      This task runs renovate-config-validator at a pinned version in a Node
      container via the `ci` toolchain. It runs through Dagger because neither
      devbox nor a shared toolchain provides the validator.
    # `sources` skips the Dagger invocation when the Renovate config is
    # unchanged. The fingerprint does not track the validator version, which
    # the `ci` module pins. Re-run with --force or `task clean` after upgrading
    # it.
    sources:
      - .github/renovate.json5
    cmds:
      - dagger call ci lint-renovate

  lint:
    desc: Lints GitHub configuration (Actions workflows and Renovate config)
    deps: [actions:lint, renovate:lint]
