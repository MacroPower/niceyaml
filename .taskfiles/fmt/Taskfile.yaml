version: "3"

set: [errexit, nounset, pipefail]
shopt: [globstar]

# Prettier checks and formats YAML, JSON, and Markdown. Devbox provides it on
# PATH with its own bundled Node runtime. The patterns carry quotes so that
# prettier expands the globs itself. .prettierignore excludes dagger.json
# files, testdata, and the generated cafe schema.
vars:
  PRETTIER_CONFIG: ./.prettierrc.yaml
  PRETTIER_PATTERNS: '"*.yaml" "*.md" "*.json" "**/*.yaml" "**/*.md" "**/*.json"'

# `sources` lets Task skip prettier when no formattable file changed. The globs
# mirror PRETTIER_PATTERNS, and the `exclude:` entries mirror .prettierignore,
# which Task does not read. .prettierignore and the config also count as
# sources, so editing either re-runs prettier. Each `exclude:` must follow the
# positive globs it negates.
tasks:
  lint:
    desc: Lints YAML, JSON, and Markdown formatting with prettier
    sources: &prettier-sources
      - "**/*.yaml"
      - "**/*.md"
      - "**/*.json"
      - .prettierignore
      - exclude: "**/dagger.json"
      - exclude: "**/testdata/**"
      - exclude: examples/schemas/cafe/cafe.v1.json
    cmds:
      - prettier --config {{.PRETTIER_CONFIG}} --check {{.PRETTIER_PATTERNS}}

  format:
    desc: Formats YAML, JSON, and Markdown with prettier
    sources: *prettier-sources
    cmds:
      - prettier --config {{.PRETTIER_CONFIG}} -w {{.PRETTIER_PATTERNS}}
