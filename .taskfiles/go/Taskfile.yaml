version: "3"

set: [errexit, nounset, pipefail]
shopt: [globstar]

# Go tasks call the local toolchain (go, golangci-lint) directly, and devbox
# provides both on PATH. The repo is a Go workspace (go.work). It holds the
# library module at the root, the bubbles and fangs adapter modules under
# bubbles and fangs, and the nyaml CLI module under cmd/nyaml. The ./...
# pattern stops at a nested module, so GO_PKGS names every tree. go mod tidy
# ignores the workspace, so the tidy tasks visit each module directory in
# GO_MODULES. Outside the repo, Go builds each module in GO_PINNED_MODULES
# against the module versions that its go.mod requires, and build:pinned
# builds them that way. Users install each module in GO_INSTALL_MODULES with
# `go install`, which refuses a go.mod that has a replace or an exclude
# directive.
vars:
  GO_PKGS: ./... ./bubbles/... ./fangs/... ./cmd/nyaml/...
  GO_MODULES: [".", "bubbles", "fangs", "cmd/nyaml"]
  GO_PINNED_MODULES: ["bubbles", "fangs", "cmd/nyaml"]
  GO_INSTALL_MODULES: ["cmd/nyaml"]
  GO_LIBRARY: go.jacobcolvin.com/niceyaml
  TEST_TIMEOUT: 30m
  # Tests whose names match this regex are integration tests. test skips them,
  # and test:integration selects them.
  INTEGRATION_PATTERN: Integration
  DEADCODE_VERSION: v0.52.0 # renovate: datasource=go depName=golang.org/x/tools

tasks:
  # lint, format, tidy, and tidy:check declare `sources`, so Task skips them on
  # a no-op `task check`. lint and format additionally read
  # .golangci.yaml and depend on the golangci-lint binary, so devbox.lock is a
  # source (a Go or golangci-lint version bump invalidates their cache). tidy
  # reads neither, so its sources stop at the module files.
  lint:
    desc: Lints Go code with golangci-lint
    sources: &go-lint-sources
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - go.work
      - .golangci.yaml
      - devbox.lock
    cmd: golangci-lint run {{.GO_PKGS}}

  format:
    desc: Formats Go code with golangci-lint --fix
    sources: *go-lint-sources
    cmd: golangci-lint run --fix {{.GO_PKGS}}

  tidy:
    desc: Tidies go.mod and go.sum in every module
    sources: &go-tidy-sources
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
    cmds:
      - for: { var: GO_MODULES }
        cmd: go -C {{.ITEM}} mod tidy

  tidy:check:
    desc: Verifies go.mod and go.sum are tidy
    summary: |
      Runs `go mod tidy -diff` once per module in GO_MODULES. The command
      reports the changes tidy would make and exits non-zero if a module needs
      any, without modifying the files. Because it writes nothing, it can run
      alongside go:lint and go:test. It also needs no .git, since CI runs the
      check inside the devbox container.
    sources: *go-tidy-sources
    cmds:
      - for: { var: GO_MODULES }
        cmd: go -C {{.ITEM}} mod tidy -diff

  # build:pinned declares no `sources`, for the reason the test tasks below
  # give. It copies each go.mod and go.sum under .tmp/ and edits the copies,
  # so it leaves the module files as they are.
  build:pinned:
    desc: Builds bubbles, fangs, and nyaml against the module versions each requires
    summary: |
      Builds and vets each module in GO_PINNED_MODULES the way Go builds it
      outside this repo. It turns the workspace off and drops the replace
      directive that bubbles and fangs hold for niceyaml. bubbles and fangs
      then get the niceyaml version that their go.mod files require, and
      cmd/nyaml gets the niceyaml, bubbles, and fangs versions that its go.mod
      requires. Every other task builds the modules against the checkout,
      where a module that uses code newer than a required version still
      builds.

      `go install <package>@<version>` refuses a go.mod that has a replace or
      an exclude directive. The task fails when the go.mod of a module in
      GO_INSTALL_MODULES has one.

      The task downloads the required versions, so it needs the network on its
      first run for a version.

      It fails when a module uses a package or a name that a required version
      lacks. Push a commit that has it, require that commit, then run this
      task again:
        lib={{.GO_LIBRARY}}
        ver() { (cd "$(mktemp -d)" && go list -m -f '{{"{{.Path}}@{{.Version}}"}}' "$1@<commit>"); }
        go -C bubbles mod edit -require="$(ver $lib)"
        go -C fangs mod edit -require="$(ver $lib)"
        go -C cmd/nyaml mod edit -require="$(ver $lib)" \
          -require="$(ver $lib/bubbles)" -require="$(ver $lib/fangs)"
        task go:tidy
    env:
      GOWORK: "off"
    cmds:
      - for: { var: GO_INSTALL_MODULES }
        cmd: |
          # The JSON form of a go.mod holds a Replace or an Exclude key only
          # when the file has that directive.
          case "$(go -C {{.ITEM}} mod edit -json)" in
            *'"Replace":'* | *'"Exclude":'*)
              echo "{{.ITEM}}/go.mod has a replace or an exclude directive, so go install refuses the module." >&2
              echo "Remove the directive and require pushed versions in its place." >&2
              exit 1
              ;;
          esac
      - for: { var: GO_PINNED_MODULES }
        cmd: |
          dir="{{.ROOT_DIR}}/.tmp/pinned/{{.ITEM}}"
          mkdir -p "$dir"
          cp {{.ITEM}}/go.mod {{.ITEM}}/go.sum "$dir"
          go mod edit -dropreplace={{.GO_LIBRARY}} "$dir/go.mod"
          go -C {{.ITEM}} mod download -modfile="$dir/go.mod" {{.GO_LIBRARY}}
          # -mod=readonly keeps go from adding a newer version of a module
          # to supply a package the required version lacks. -o /dev/null
          # keeps go from writing the nyaml binary into cmd/nyaml.
          if ! go -C {{.ITEM}} build -mod=readonly -modfile="$dir/go.mod" -o /dev/null ./... ||
            ! go -C {{.ITEM}} vet -mod=readonly -modfile="$dir/go.mod" ./...; then
            echo "{{.ITEM}} does not build against the module versions that {{.ITEM}}/go.mod requires." >&2
            echo "Run 'task --summary go:build:pinned' for the fix." >&2
            exit 1
          fi

  # test, test:integration, and test:cover deliberately declare no `sources`.
  # Go's build and test cache is content-addressed and re-runs the packages
  # that changed. A file-glob fingerprint would be coarser and could skip a
  # stale test.
  test:
    desc: Runs Go unit tests (skips integration tests) with the race detector
    summary: |
      Runs the unit tests with the race detector.

      For a single package or extra flags, call go directly:
        go test -run TestName ./schema/...
    cmds:
      - go test -timeout={{.TEST_TIMEOUT}} -skip {{.INTEGRATION_PATTERN}} -race {{.GO_PKGS}}

  test:integration:
    desc: Runs Go integration tests with the race detector
    cmds:
      - go test -timeout={{.TEST_TIMEOUT}} -run {{.INTEGRATION_PATTERN}} -race {{.GO_PKGS}}

  test:cover:
    desc: Runs all Go tests with coverage profiling
    summary: |
      Runs every test (unit and integration) with -coverprofile, which
      disables Go's test result cache. Writes the profile to OUTPUT.

      Args:
        OUTPUT: Coverage profile path (default: .test/coverage.txt)
    vars:
      OUTPUT: '{{.OUTPUT | default ".test/coverage.txt"}}'
    env:
      CGO_ENABLED: "1"
    cmds:
      - mkdir -p .test
      - go test -timeout={{.TEST_TIMEOUT}} -race -coverprofile={{.OUTPUT}} {{.GO_PKGS}}

  generate:
    desc: Runs go generate
    cmds:
      - go generate {{.GO_PKGS}}

  # deadcode, bench, and docs are advisory tasks that exist to print a report
  # to stdout. They deliberately declare no `sources`, because a cache hit
  # would skip the command and suppress the report. Run them on demand.
  deadcode:
    desc: Reports unreachable Go functions (advisory)
    label: "go:deadcode {{.PKG}}"
    summary: |
      Reports unreachable functions with the golang.org/x/tools deadcode
      analyzer. The report is advisory, and the standard gate does not run it.

      Args:
        PKG: Go package(s) to analyze (default: ./...)
    vars:
      PKG: "{{.PKG | default .GO_PKGS}}"
    cmds:
      - go run golang.org/x/tools/cmd/deadcode@{{.DEADCODE_VERSION}} {{.PKG}}

  bench:
    desc: Runs Go benchmarks on the host
    label: "go:bench {{.PKG}}"
    summary: |
      Runs Go benchmarks on the host. Benchmarks measure host performance,
      so they stay outside Dagger where containerization would distort
      results.

      Args:
        PKG: Go package to benchmark (default: go.jacobcolvin.com/niceyaml/...)
        FLAGS: Additional flags to pass to `go test` (default: "")

      Examples:
        task go:bench PKG=./diff FLAGS="-cpuprofile profile.out -run=^\$"
    vars:
      PKG: '{{.PKG | default "go.jacobcolvin.com/niceyaml/..."}}'
      FLAGS: '{{.FLAGS | default ""}}'
    cmds:
      - go test -bench=. -benchmem {{.FLAGS}} {{.PKG}}

  docs:
    desc: Prints Go documentation for all packages
    label: "go:docs {{.PKG}}"
    summary: |
      Prints Go documentation for all packages. Runs on the host for fast,
      interactive reading.

      Args:
        PKG: Go package(s) to document (default: go.jacobcolvin.com/niceyaml/...)
        FLAGS: Additional flags to pass to `go doc` (default: "")
    vars:
      PKG: '{{.PKG | default "go.jacobcolvin.com/niceyaml/..."}}'
      FLAGS: '{{.FLAGS | default ""}}'
      PACKAGES:
        sh: go list {{.PKG}} | grep -v -E '/(examples|cmd)(/|$)'
    cmds:
      - for: { var: PACKAGES, split: "\n" }
        cmd: echo "--------------------------------------------------------------------------------" && go doc {{.FLAGS}} {{.ITEM}}
