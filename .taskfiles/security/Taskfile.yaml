version: "3"

set: [errexit, nounset, pipefail]
shopt: [globstar]

# scan deliberately declares no `sources`. Its result also depends on the
# external vulnerability database, which changes independently of the source
# tree. A source-only checksum could report a stale "no vulnerabilities" pass
# after a new advisory appears. Dagger's cache governs how often the scan
# re-runs.
tasks:
  scan:
    desc: Scans source dependencies for vulnerabilities via the security toolchain
    cmd: dagger call ci security

  sarif-source:
    desc: Generates the source-dependency SARIF report for GitHub Code Scanning
    cmd: dagger call ci security-source-sarif export --path trivy-source.sarif
