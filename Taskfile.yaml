version: "3"

set: [errexit, nounset, pipefail]
shopt: [globstar]

# Recursive `sources` globs reach into hidden and build directories, so Task
# drops whatever .gitignore excludes from the fingerprints (.claude/worktrees/,
# .devbox/, .task/, .test/, .tmp/, .worktrees/, dist/).
use_gitignore: true

# Keep each namespace in its own file under .taskfiles/, even a namespace that
# holds only thin Dagger wrappers.
includes:
  dagger: ./.taskfiles/dagger/Taskfile.yaml
  dev: ./.taskfiles/dev/Taskfile.yaml
  fmt: ./.taskfiles/fmt/Taskfile.yaml
  gh: ./.taskfiles/gh/Taskfile.yaml
  git: ./.taskfiles/git/Taskfile.yaml
  go: ./.taskfiles/go/Taskfile.yaml
  security: ./.taskfiles/security/Taskfile.yaml

tasks:
  default:
    cmd: task -l

  format:
    desc: Runs all format and generate targets
    cmds:
      - task: go:tidy
      - task: go:generate
      - task: go:format
      - task: fmt:format

  lint:
    desc: Runs all lint targets
    deps: [go:lint, go:tidy:check, fmt:lint]

  test:
    desc: Runs all test targets (unit and integration)
    deps: [go:test, go:test:integration]

  docs:
    desc: Runs all docs targets
    deps: [go:docs]

  # check is the fast local gate. lint and test invoke their tools straight off
  # the devbox PATH, so check needs no Dagger engine. check:ci adds the gates
  # that run through Dagger because their tools (Trivy, zizmor,
  # renovate-config-validator) are not on the devbox PATH. check:all runs both
  # and go:build:pinned, so it matches the gates in the validate.yaml matrix.
  # go:build:pinned stays out of check because it passes only after the
  # niceyaml commit that bubbles and fangs require is pushed.
  check:
    desc: Runs the local checks using devbox
    deps: [lint, test]

  check:ci:
    desc: Runs the Dagger-backed checks
    deps: [security:scan, gh:lint]

  check:all:
    desc: Runs every check, local and Dagger-backed
    deps: [check, check:ci, go:build:pinned]

  scan:
    desc: Scans source dependencies for vulnerabilities
    cmds:
      - task: security:scan

  pre-commit:
    desc: Runs all pre-commit targets
    cmds:
      - task: format
      - task: lint
      - task: test

  install:
    desc: Runs all install targets
    deps: [dev:install, git:hooks:install, install:nyaml]

  install:nyaml:
    desc: Builds and installs the nyaml binary
    cmds:
      - go install ./cmd/nyaml

  clean:
    desc: Removes build artifacts and caches
    cmds:
      - rm -rf dist/ .test/ .task/ .tmp/
