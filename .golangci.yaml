version: "2"
run:
  # Timeout for analysis, e.g. 30s, 5m.
  timeout: 5m
  allow-parallel-runners: true

output:
  show-stats: true

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
        - alias
        - localmodule
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    golines:
      reformat-tags: false
      max-len: 120

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - depguard
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - godoclint
    - godot
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - intrange
    - iotamixing
    # - ireturn
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - noinlineerr
    # - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    # - perfsprint
    # - prealloc
    - predeclared
    - reassign
    - recvcheck
    # - revive
    - sloglint
    - staticcheck
    - tagalign
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - wrapcheck
    - wsl_v5

  settings:
    misspell:
      locale: US
      mode: default

    exhaustive:
      default-signifies-exhaustive: true

    recvcheck:
      # Bubble Tea requires value receivers on tea.Model methods, while the
      # rest of a model mutates through a pointer.
      exclusions:
        - "*.Init"
        - "*.Update"
        - "*.View"

    wsl_v5:
      allow-whole-block: true
      case-max-lines: 2
      default: all
      disable:
        - assign-exclusive
        - if

    unused:
      field-writes-are-uses: false
      exported-fields-are-used: false
      local-variables-are-used: false

    govet:
      enable-all: true
      disable:
        - shadow

    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true

    testifylint:
      enable-all: true
      expected-actual:
        pattern: ^want

    testpackage:
      # The default skips export_test.go and *_internal_test.go, which
      # lets a test reach unexported code. No file name matches this
      # pattern, so every test file outside package main is checked.
      skip-regexp: ^$

    sloglint:
      attr-only: true
      static-msg: true
      args-on-sep-lines: true
      key-naming-case: snake
      context: scope
      forbidden-keys:
        - time
        - level
        - msg

    gocritic:
      enable-all: true
      disabled-checks:
        - unnamedResult
        - singleCaseSwitch
      settings:
        hugeParam:
          sizeThreshold: 256

    godoclint:
      default: all
      disable:
        - require-pkg-doc
      options:
        max-len:
          length: 88

    godot:
      scope: noinline
      period: true
      capital: true

    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
        - os.Remove
        - os.RemoveAll
        # The lipgloss counterparts of the fmt functions errcheck skips.
        - charm.land/lipgloss/v2.Print
        - charm.land/lipgloss/v2.Printf
        - charm.land/lipgloss/v2.Println

    grouper:
      import-require-single-import: true
      var-require-single-var: true

    depguard:
      rules:
        main:
          deny:
            - pkg: "golang.org/x/exp/slog"
              desc: use log/slog
            - pkg: "github.com/pkg/errors"
              desc: use errors
        # The bubbles and fangs modules are adapters a caller could write, so
        # their non-test code builds on the public API of niceyaml alone. Go
        # allows the import because their module paths sit under the
        # library's. Their tests may still import internal/yamltest.
        adapters:
          files:
            - "**/bubbles/**"
            - "**/fangs/**"
            - "!$test"
          deny:
            - pkg: "go.jacobcolvin.com/niceyaml/internal"
              desc: build on the public API of niceyaml

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - promlinter
          - goconst
          - gosec
          - gosmopolitan
          - godoclint
      - path: _test\.go
        text: "fieldalignment:"
      - source: "= `"
        linters:
          - grouper
      - text: "\\*github\\.com/hashicorp/go-multierror\\.Error"
        linters:
          - wrapcheck
      - text: "\\*go\\.jacobcolvin\\.com/niceyaml\\.Source"
        linters:
          - wrapcheck
      # NewSummary builds a new error from others, as errors.Join does.
      - text: "go\\.jacobcolvin\\.com/niceyaml\\.NewSummary"
        linters:
          - wrapcheck
      # Invalid and Place build a new error around another, as
      # fmt.Errorf does.
      - text: "go\\.jacobcolvin\\.com/niceyaml\\.(Invalid|Place)"
        linters:
          - wrapcheck
      - path: cmd/
        linters:
          - wrapcheck
          - godoclint
          - gosec
      - path: internal/
        linters:
          - wrapcheck
      - path: examples/
        text: "printf"
        linters:
          - govet
      # errcheck reports the unhandled errors that matter in an example.
      - path: examples/
        text: "G104"
        linters:
          - gosec
      - path: style/theme/
        linters:
          - dupl
          # The theme catalog repeats hex colors across palettes.
          - goconst
