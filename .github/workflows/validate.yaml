name: validate

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each entry is a function on the `ci` toolchain. lint, build-pinned,
        # test, and test-integration run the matching Taskfile target inside
        # the devbox environment (dagger -> devbox -> task). build-pinned
        # builds bubbles and fangs against the niceyaml version each requires,
        # as a module outside the repo does. The rest compose a toolchain
        # or a Node container directly. security runs Trivy through the
        # security toolchain, lint-actions runs zizmor through the zizmor
        # toolchain, and lint-renovate runs renovate-config-validator in a
        # Node container. The matrix covers the gates that `task check:all`
        # runs.
        task:
          - lint
          - build-pinned
          - test
          - test-integration
          - security
          - lint-actions
          - lint-renovate
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run ci ${{ matrix.task }}
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          call: ci ${{ matrix.task }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          enable-github-summary: "true"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Export coverage profile
        if: ${{ !cancelled() }}
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          call: ci test-coverage --output=coverage.txt
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          enable-github-summary: "true"

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
