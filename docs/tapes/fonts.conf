<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  This config gives vhs only the fonts that devbox.json installs, so host
  fonts never change a recording. The tapes set Fira Code, and Chromium falls
  back to the Noto fonts for the scripts and symbols in the testdata.

  noto-fonts covers every script, and fontconfig would pick an arbitrary
  family among the ones that share a script, such as Noto Nastaliq Urdu for
  Arabic. The selectfont rules keep one family for each script that the
  testdata uses.

  Noto Sans Math stays out because it also maps Arabic letters. Chromium
  then draws an Arabic letter in it, and the font has no glyph for the
  mark that follows, so the pair renders as two boxes.
-->
<fontconfig>
  <dir prefix="relative">.devbox/nix/profile/default/share/fonts</dir>
  <selectfont>
    <acceptfont>
      <glob>*/noto/NotoColorEmoji.ttf</glob>
      <glob>*/noto/NotoSans.ttf</glob>
      <glob>*/noto/NotoSansArabic.ttf</glob>
      <glob>*/noto/NotoSansHebrew.ttf</glob>
      <glob>*/noto/NotoSansSymbols.ttf</glob>
      <glob>*/noto/NotoSansSymbols2-Regular.otf</glob>
    </acceptfont>
    <rejectfont>
      <glob>*/noto/*</glob>
    </rejectfont>
  </selectfont>
  <cachedir prefix="xdg">vhs-fontconfig</cachedir>
</fontconfig>
